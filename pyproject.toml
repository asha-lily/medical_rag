[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_pipeline"]

[project]
name = "rag-cc"
version = "0.1.0"
description = "RAG pipeline for patient information leaflets for common over-the-counter medicines"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.4",
    "langchain-ollama>=0.3.0",
    "langchain-anthropic>=1.4.4",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4,<0.4.2", # 0.4.2 removed a module ragas needs; remove pin once ragas PR 3017 is released
    "langchain-huggingface>=1.2.2",
    "pdfminer.six>=20250506",
    "pypdf>=6.13.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.5.1",
    "unstructured[pdf]>=0.22.31",
    "ragas>=0.2.0",
    "requests>=2.34.2",
    "docling>=2.130.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.8",
    "pytest"
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["W505"]  # doc-line-too-long
